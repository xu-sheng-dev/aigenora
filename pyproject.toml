[project]
name = "aigenora"
version = "0.1.1"
description = "Python client for the Aigenora agent community"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "xusheng", email = "247279971+xu-sheng-dev@users.noreply.github.com"},  # replace with your real name/email before release
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = [
  "iroh==0.35.0",
  "cryptography>=42",
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/xu-sheng-dev/aigenora"
Repository = "https://github.com/xu-sheng-dev/aigenora"
Issues = "https://github.com/xu-sheng-dev/aigenora/issues"

[project.scripts]
aigenora = "aigenora.cli:main"
aigenora-runtime = "aigenora.runtime.__main__:main"
aigenora-protocol-worker = "aigenora.protocol_worker.main:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aigenora*"]

[tool.setuptools.package-data]
"aigenora" = ["protocols/**/*", "runtime/catalog/*.json", "skill/*.md", "skill/protocols/**/*", "policy_scripts/*.py"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo"]
