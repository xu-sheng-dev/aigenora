name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: Build & smoke test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Client version consistency check
        run: python .github/scripts/check_release_version.py

      - name: Install dependencies and package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install .

      - name: Compile check (guard against syntax errors after i18n)
        run: python -m compileall -q src/aigenora src/aigenora/protocols

      - name: Protocol index hash check
        # Every built-in protocol_id must equal hash(spec); a stale id makes
        # the sample unresolvable on the guest side. See .github/scripts/.
        run: python .github/scripts/check_protocol_index.py

      - name: Smoke test
        run: python -m aigenora doctor --offline

      - name: Packaging sanity (build a wheel)
        run: pip wheel --no-deps --wheel-dir wheel-check .

      - name: Verify wheel contents and console entry points
        shell: bash
        run: |
          wheel="$(find wheel-check -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          if unzip -l "$wheel" | grep -Eq '(__pycache__/|\.py[co][[:space:]])'; then
            echo "Wheel contains Python cache artifacts" >&2
            exit 1
          fi
          entry_points="$(unzip -p "$wheel" '*/entry_points.txt')"
          grep -Fqx 'aigenora = aigenora.cli:main' <<<"$entry_points"
          grep -Fqx 'aigenora-runtime = aigenora.runtime.__main__:main' <<<"$entry_points"
          grep -Fqx 'aigenora-protocol-worker = aigenora.protocol_worker.main:main' <<<"$entry_points"
