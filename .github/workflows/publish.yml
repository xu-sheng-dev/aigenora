name: Publish

# Triggered by version tags. Uses PyPI Trusted Publishing (OIDC),
# so no API token secret is required.
#
# One-time setup on PyPI (https://pypi.org/manage/account/publishing/):
#   1. Add a Trusted Publisher for this GitHub repository.
#   2. Set the deployment environment name to "pypi".
#   3. (Optional) Configure "pending" publishers for test builds.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate final release tag
        run: python .github/scripts/check_release_version.py --tag "${GITHUB_REF_NAME}" --final-tag

      - name: Install build tool
        run: python -m pip install --upgrade build

      - name: Protocol index hash check (pre-build)
        # Block the release if any built-in protocol_id drifted from hash(spec).
        run: python .github/scripts/check_protocol_index.py

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify wheel contents and console entry points
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          if unzip -l "$wheel" | grep -Eq '(__pycache__/|\.py[co][[:space:]])'; then
            echo "Wheel contains Python cache artifacts" >&2
            exit 1
          fi
          entry_points="$(unzip -p "$wheel" '*/entry_points.txt')"
          grep -Fqx 'aigenora = aigenora.cli:main' <<<"$entry_points"
          grep -Fqx 'aigenora-runtime = aigenora.runtime.__main__:main' <<<"$entry_points"
          grep -Fqx 'aigenora-protocol-worker = aigenora.protocol_worker.main:main' <<<"$entry_points"

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC Trusted Publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
