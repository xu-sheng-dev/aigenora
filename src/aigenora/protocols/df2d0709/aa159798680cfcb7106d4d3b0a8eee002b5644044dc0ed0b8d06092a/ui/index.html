<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hero Duel · Aigenora</title>
  <style>
    :root { --void:#0c0d13; --panel:#151821; --line:#303541; --paper:#ece8dd; --muted:#969ba8; --host:#e05c4f; --guest:#4d8adf; --mana:#54a9d8; --gold:#e2b85f; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--paper); background:var(--void); font-family:Inter,ui-sans-serif,system-ui,"Microsoft YaHei",sans-serif; }
    button { font:inherit; }
    .shell { width:min(1100px,100%); min-height:100vh; margin:auto; padding:24px clamp(16px,4vw,48px); background:var(--panel); border-inline:1px solid #20232c; }
    header { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; padding-bottom:18px; border-bottom:1px solid var(--line); }
    .kicker { color:var(--gold); font:700 10px ui-monospace,Consolas,monospace; letter-spacing:.18em; text-transform:uppercase; }
    h1 { margin:6px 0 2px; font:600 clamp(28px,4vw,42px)/1 Georgia,"Noto Serif SC",serif; }
    .sub { color:var(--muted); font-size:12px; }
    .mode { padding:8px 11px; border:1px solid var(--line); font-size:12px; }
    .arena { display:grid; grid-template-columns:1fr 88px 1fr; gap:20px; align-items:stretch; padding:28px 0; }
    .fighter { padding:20px; border-top:3px solid var(--side); background:#11141b; }
    .fighter.right { text-align:right; }
    .side-label { color:var(--side); font:700 10px ui-monospace,monospace; letter-spacing:.14em; }
    .hero { margin:5px 0 17px; font:600 25px Georgia,serif; text-transform:capitalize; }
    .metric { margin:12px 0; }
    .metric-head { display:flex; justify-content:space-between; color:var(--muted); font-size:11px; }
    .bar { height:9px; margin-top:5px; background:#272b34; overflow:hidden; }
    .fill { width:0; height:100%; background:var(--side); transition:width .25s ease; }
    .fill.mana { background:var(--mana); }
    .vs { display:grid; place-items:center; color:#666d7a; font:italic 700 28px Georgia,serif; }
    .round-panel { display:grid; grid-template-columns:1fr auto; gap:18px; align-items:center; padding:15px 0; border-block:1px solid var(--line); }
    .round-panel b { font:600 18px Georgia,serif; }
    .event { color:var(--muted); font-size:12px; margin-top:5px; }
    .timer { color:var(--gold); font:700 16px ui-monospace,Consolas,monospace; }
    .actions { padding-top:24px; }
    .actions-head { display:flex; justify-content:space-between; gap:14px; align-items:end; margin-bottom:13px; }
    .actions-head h2 { margin:0; font:600 20px Georgia,"Noto Serif SC",serif; }
    .actions-head span { color:var(--muted); font-size:12px; }
    .move-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
    .move { min-height:116px; padding:15px; border:1px solid var(--line); color:var(--paper); background:#10131a; text-align:left; cursor:pointer; transition:border-color .14s,transform .14s; }
    .move:hover:not(:disabled), .move:focus-visible { border-color:var(--gold); transform:translateY(-3px); outline:none; }
    .move:disabled { opacity:.37; cursor:not-allowed; }
    .move strong { display:block; font:600 17px Georgia,serif; }
    .move small { display:block; margin-top:8px; color:var(--muted); line-height:1.5; }
    .move .key { display:block; margin-top:12px; color:var(--gold); font:700 9px ui-monospace,monospace; letter-spacing:.12em; }
    .notice { min-height:22px; margin-top:12px; color:var(--muted); font-size:12px; }
    .notice.error { color:#ff9b91; }
    body[data-control-mode="autonomous"] .actions { display:none; }
    @media (max-width:700px) {
      .arena { grid-template-columns:1fr 42px 1fr; gap:8px; }
      .fighter { padding:14px 10px; }
      .hero { font-size:19px; }
      .move-grid { grid-template-columns:1fr 1fr; }
      .round-panel { grid-template-columns:1fr; }
    }
  </style>
</head>
<body data-control-mode="autonomous">
  <main class="shell">
    <header>
      <div><div class="kicker">Aigenora · Commit / Reveal Arena</div><h1>英雄对决</h1><div class="sub">双方动作同时密封提交，揭示后由确定性规则裁决</div></div>
      <div class="mode" id="mode">读取模式…</div>
    </header>
    <section class="arena">
      <article class="fighter" style="--side:var(--host)">
        <div class="side-label">HOST</div><div class="hero" id="host-hero">—</div>
        <div class="metric"><div class="metric-head"><span>生命</span><span id="host-hp-text">—</span></div><div class="bar"><div class="fill" id="host-hp"></div></div></div>
        <div class="metric"><div class="metric-head"><span>法力</span><span id="host-mana-text">—</span></div><div class="bar"><div class="fill mana" id="host-mana"></div></div></div>
      </article>
      <div class="vs">VS</div>
      <article class="fighter right" style="--side:var(--guest)">
        <div class="side-label">GUEST</div><div class="hero" id="guest-hero">—</div>
        <div class="metric"><div class="metric-head"><span>生命</span><span id="guest-hp-text">—</span></div><div class="bar"><div class="fill" id="guest-hp"></div></div></div>
        <div class="metric"><div class="metric-head"><span>法力</span><span id="guest-mana-text">—</span></div><div class="bar"><div class="fill mana" id="guest-mana"></div></div></div>
      </article>
    </section>
    <section class="round-panel">
      <div><b id="round">第 — 回合</b><div class="event" id="event">正在等待战斗状态</div></div>
      <div class="timer" id="timer">—</div>
    </section>
    <section class="actions">
      <div class="actions-head"><div><h2 id="action-title">选择本回合动作</h2><span id="action-hint">页面不会替你选择。</span></div><span id="role">—</span></div>
      <div class="move-grid">
        <button class="move" data-move="normal"><strong>普通攻击</strong><small id="normal-info">无消耗 · 无冷却</small><span class="key">NORMAL</span></button>
        <button class="move" data-move="skill_a"><strong>技能 A</strong><small id="skill_a-info">—</small><span class="key">SKILL A</span></button>
        <button class="move" data-move="skill_b"><strong>技能 B</strong><small id="skill_b-info">—</small><span class="key">SKILL B</span></button>
        <button class="move" data-move="ult"><strong>终极技能</strong><small id="ult-info">—</small><span class="key">ULTIMATE</span></button>
      </div>
    </section>
    <div class="notice" id="notice" role="status" aria-live="polite"></div>
  </main>
  <script>
    const $=id=>document.getElementById(id), MOVES=["normal","skill_a","skill_b","ult"];
    let info={},snap={},sending=false;
    function pct(v,max){return max?Math.max(0,Math.min(100,v/max*100)):0;}
    function metric(side,key){const value=Number((snap[key]||{})[side]||0),max=Number((snap[key+"_max"]||{})[side]||0);$(side+"-"+key+"-text").textContent=`${value} / ${max}`;$(side+"-"+key).style.width=`${pct(value,max)}%`;}
    function render(){
      const mode=info.control_mode||snap.control_mode||"autonomous";document.body.dataset.controlMode=mode;
      $("mode").textContent=({human:"完全人工",hybrid:"人机混合",autonomous:"全自动"})[mode]||mode;
      $("role").textContent=info.role?`你是 ${info.role.toUpperCase()}`:"—";
      $("host-hero").textContent=(snap.heroes||{}).host||"—";$("guest-hero").textContent=(snap.heroes||{}).guest||"—";
      ["host","guest"].forEach(side=>{metric(side,"hp");metric(side,"mana");});
      $("round").textContent=`第 ${snap.round??"—"} / ${snap.max_rounds??"—"} 回合`;
      $("event").textContent=(snap.last_event||{}).summary||"双方正在准备";
      const timing=snap.timing||{},open=timing.match_key==="round"&&snap.phase!=="game_over"&&mode!=="autonomous";
      $("action-title").textContent=open?"选择本回合动作":snap.phase==="game_over"?"对局已经结束":"等待决策窗口";
      $("action-hint").textContent=mode==="human"?"必须明确选择；超时不会自动出招。":mode==="hybrid"?"可选人工干预；否则 Agent 自动出招。":"Agent 正在自主出招。";
      const side=info.role||"host",mana=Number((snap.mana||{})[side]||0),cd=(snap.cooldowns||{})[side]||{},stats=(snap.hero_stats||{})[side]||{};
      $("normal-info").textContent=`伤害 ${stats.atk??"—"} · 无消耗`;
      MOVES.forEach(move=>{const btn=document.querySelector(`[data-move="${move}"]`);let available=open&&!sending;if(move!=="normal"){const skill=stats[move]||{};$(move+"-info").textContent=`伤害 ${skill.dmg??"—"} · 法力 ${skill.cost??"—"} · 冷却 ${cd[move]??"—"}`;available=available&&mana>=Number(skill.cost||0)&&Number(cd[move]||0)===0;}btn.disabled=!available;});
      renderTimer();
    }
    function renderTimer(){const d=Number(snap.timing&&snap.timing.deadline_at_epoch);$("timer").textContent=d?`剩余 ${Math.max(0,d-Date.now()/1000).toFixed(1)}s`:"—";}
    async function submit(move){const timing=snap.timing;if(sending||!timing||timing.match_key!=="round")return;sending=true;render();try{const r=await fetch("/api/decide",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({round:timing.match_value,move})});const b=await r.json();if(!r.ok||b.ok===false)throw new Error(b.error||b.reason||`HTTP ${r.status}`);$("notice").className="notice";$("notice").textContent="动作已密封提交，等待双方揭示。";}catch(err){$("notice").className="notice error";$("notice").textContent=`提交失败：${err.message}`;}finally{sending=false;render();}}
    document.querySelectorAll("[data-move]").forEach(btn=>btn.onclick=()=>submit(btn.dataset.move));
    async function refresh(){try{const [ir,sr]=await Promise.all([fetch("/api/info",{cache:"no-store"}),fetch("/api/snapshot",{cache:"no-store"})]);if(ir.ok)info=await ir.json();if(sr.ok)snap=await sr.json();render();}catch(err){$("notice").className="notice error";$("notice").textContent="正在重新连接本地会话…";}}
    refresh();setInterval(refresh,500);setInterval(renderTimer,100);
  </script>
</body>
</html>
