<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Upgrade (Tractor) · Aigenora</title>
  <style>
    :root{--ink:#171714;--paper:#eee3c8;--paper2:#d8c9a6;--cinnabar:#a33428;--deepred:#5b1915;--gold:#c7a14e;--green:#244a3b;--green2:#102d25;--muted:#998b6d}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#120f0b;color:var(--paper)}body{font-family:Georgia,"Times New Roman",serif;background-image:linear-gradient(115deg,rgba(163,52,40,.18),transparent 42%),repeating-linear-gradient(90deg,transparent 0,transparent 49px,rgba(255,255,255,.015) 50px)}
    button{font:inherit}.hall{width:min(1500px,100%);min-height:100vh;margin:auto;padding:18px clamp(10px,2.8vw,42px) 32px}
    header{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:end;padding-bottom:14px;border-bottom:1px solid var(--gold)}.seal{display:grid;place-items:center;width:48px;height:48px;background:var(--cinnabar);color:var(--paper);font-size:12px;line-height:1.1;text-align:center}.kicker{color:var(--gold);font:9px ui-monospace,Consolas,monospace;letter-spacing:.22em}h1{margin:5px 0 0;font-size:clamp(31px,5vw,57px);font-weight:400;letter-spacing:-.045em}.telemetry{text-align:right;font:10px/1.6 ui-monospace,Consolas,monospace;color:var(--muted)}.telemetry b{display:block;color:var(--paper);font-size:14px}
    .notice{display:none;margin-top:11px;padding:8px 12px;border-left:5px solid var(--gold);background:#2a2116;color:var(--gold);font:10px ui-monospace,Consolas,monospace}.notice.show{display:block}
    .score-strip{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:14px;border:1px solid #5c503c;background:#211c14}.team{display:flex;justify-content:space-between;align-items:center;padding:11px 15px}.team.right{text-align:right}.team small{color:var(--muted);font:9px ui-monospace,Consolas,monospace}.team b{font-size:25px;color:var(--gold)}.versus{padding:8px 18px;border-inline:1px solid #5c503c;color:var(--cinnabar);font-style:italic}
    .table{margin-top:14px;padding:14px;border:10px solid #614229;outline:2px solid var(--gold);background:radial-gradient(circle,var(--green) 0,var(--green2) 80%);box-shadow:inset 0 0 55px #061a15}
    .players{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.player{position:relative;min-width:0;padding:10px;border:1px solid #4c7465;background:#153a30}.player.current{border-color:var(--gold);box-shadow:inset 0 -4px var(--gold)}.player.you{background:#235244}.player small{display:block;color:#9cb8ae;font:8px ui-monospace,Consolas,monospace}.player b{display:block;margin:5px 0;overflow:hidden;text-overflow:ellipsis;font:12px ui-monospace,Consolas,monospace}.player strong{color:var(--gold)}.player .badge{float:right;color:#df8d78;font-size:9px}
    .center{display:grid;grid-template-columns:minmax(180px,.75fr) minmax(360px,1.5fr) minmax(180px,.75fr);gap:16px;align-items:center;min-height:315px;padding:20px 0}.panel{text-align:center}.label{color:#9cb8ae;font:9px ui-monospace,Consolas,monospace;letter-spacing:.17em}.declarations{text-align:left}.declaration{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dotted #517366;color:#b9d0c8;font:9px ui-monospace,Consolas,monospace}.declaration b{color:var(--gold)}
    .trick h2{margin:8px 0 13px;font-size:23px;font-weight:400}.cards{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}.kitty-count{font-size:61px;color:var(--gold);line-height:1}.kitty small{display:block;color:#9cb8ae;font:9px ui-monospace,Consolas,monospace}
    .card{position:relative;width:62px;height:88px;padding:7px;border:1px solid #c5b894;border-radius:3px;background:#fff9e9;color:var(--ink);text-align:left;box-shadow:2px 3px 0 rgba(0,0,0,.32);user-select:none}.card.red{color:var(--cinnabar)}.card strong{display:block;font-size:18px}.card span{display:block;font-size:19px}.card em{position:absolute;right:4px;bottom:3px;color:#8e836b;font:8px ui-monospace,Consolas,monospace;font-style:normal}button.card{cursor:pointer;transition:.13s transform}button.card:hover,button.card:focus-visible{transform:translateY(-7px);outline:2px solid var(--gold)}button.card.selected{transform:translateY(-13px);box-shadow:0 0 0 4px var(--gold)}
    .hand-zone{border-top:1px solid #547566;padding-top:13px}.hand-head{display:flex;justify-content:space-between;align-items:end}.hand-head b{font-size:21px}.hand-head small{color:#9cb8ae;font:9px ui-monospace,Consolas,monospace}.hand-scroll{overflow-x:auto;padding:18px 5px 4px}.hand{display:flex;justify-content:center;min-width:max-content}.hand .card{margin-left:-18px}.hand .card:first-child{margin-left:0}
    .controls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:15px}.controls button{min-width:110px;padding:9px 13px;border:1px solid var(--gold);background:#102d25;color:var(--paper);cursor:pointer}.controls button.primary{background:var(--gold);color:var(--ink);font-weight:800}.controls button.pass{border-color:var(--cinnabar);color:#efb0a6}.controls button:disabled{opacity:.3;cursor:not-allowed}.status{min-height:23px;padding-top:10px;text-align:center;color:#9cb8ae;font:9px ui-monospace,Consolas,monospace}.status.error{color:#ff9183}
    @media(max-width:900px){.players{grid-template-columns:1fr 1fr}.center{grid-template-columns:1fr 1fr}.trick{grid-column:1/-1;grid-row:1}.hand{justify-content:flex-start}}
    @media(max-width:600px){header{grid-template-columns:auto 1fr}.telemetry{grid-column:1/-1;text-align:left}.score-strip{grid-template-columns:1fr 1fr}.versus{display:none}.team{display:grid;grid-template-columns:1fr;align-items:start;padding:10px}.team>div{grid-row:1}.team>span{grid-row:2;margin-top:5px;font:9px ui-monospace,Consolas,monospace}.team b{display:block;font-size:20px;white-space:nowrap}.team small{font-size:7px}.table{border-width:5px;padding:8px}.center{display:block}.panel{margin:16px 0}.card{width:52px;height:76px}}
  </style>
</head>
<body>
<main class="hall">
  <header><div class="seal">8<br>0</div><div><div class="kicker">AIGENORA · PARTNERSHIP HALL</div><h1>Upgrade <i>(Tractor)</i></h1></div><div class="telemetry"><span id="link">TABLE LINK OFFLINE</span><b id="phase">WAITING</b><span id="frame">E— · F—</span></div></header>
  <div class="notice" id="notice"></div>
  <div class="score-strip"><div class="team"><div><small>EVEN SEATS · TEAM 0</small><b id="team0">LEVEL —</b></div><span id="points0">0 PTS</span></div><div class="versus">versus</div><div class="team right"><span id="points1">0 PTS</span><div><small>ODD SEATS · TEAM 1</small><b id="team1">LEVEL —</b></div></div></div>
  <section class="table">
    <div class="players" id="players"></div>
    <div class="center">
      <section class="panel declarations"><div class="label">TRUMP DECLARATIONS</div><div id="declarations"></div></section>
      <section class="panel trick"><div class="label">CURRENT TRICK</div><h2 id="trick-label">Awaiting the lead</h2><div class="cards" id="trick"></div></section>
      <section class="panel kitty"><div class="label">HIDDEN KITTY</div><div class="kitty-count" id="kitty">8</div><small id="trump">TRUMP UNDECLARED</small></section>
    </div>
    <div class="hand-zone"><div class="hand-head"><div><small>YOUR PRIVATE HAND</small><b id="hand-count">0 cards</b></div><small id="turn">WAITING</small></div><div class="hand-scroll"><div class="hand" id="hand"></div></div><div class="controls" id="controls"></div><div class="status" id="status" role="status"></div></div>
  </section>
</main>
<script>
(function(){
  "use strict";
  var ORIGIN=new URLSearchParams(location.search).get("parent")||location.origin,pending={},snapshot={},view={},ready=false,selected=new Set(),lastHand="";
  function post(message){parent.postMessage(Object.assign({source:"aigenora-ui"},message),ORIGIN)}
  function request(method,body){return new Promise(function(resolve,reject){var id="upgrade_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7),timer=setTimeout(function(){delete pending[id];reject(new Error("table bridge timeout"))},5000);pending[id]=function(value){clearTimeout(timer);resolve(value)};post({type:"request",id:id,method:method,body:body})})}
  window.addEventListener("message",function(event){if(event.origin!==ORIGIN)return;var data=event.data||{};if(data.source!=="aigenora-broadcast")return;if(data.type==="hello-ack"){ready=true;document.getElementById("link").textContent="SIGNED TABLE LINK";request("snapshot").then(receive).catch(fail);return}if(data.type==="response"&&pending[data.id]){var cb=pending[data.id];delete pending[data.id];cb(data);return}if(data.type==="push"&&data.event==="snapshot")apply(data.data)});
  function receive(response){if(response.ok)apply(response.data);else fail(new Error(errorText(response)))}
  function apply(next){if(!next||typeof next!=="object")return;snapshot=next;view=next.group_view||{};var key=(view.my_hand||[]).map(function(card){return card.card_id}).join(",");if(key!==lastHand){selected.clear();lastHand=key}render()}
  function shortKey(value){return String(value||"").slice(0,8).toUpperCase()}
  function rank(card){return({11:"J",12:"Q",13:"K",14:"A",16:"SJ",17:"BJ"})[card.rank]||String(card.rank)}
  function suit(card){return({clubs:"♣",diamonds:"♦",hearts:"♥",spades:"♠",joker:"★"})[card.suit]||""}
  function cardNode(card,active){var el=document.createElement(active?"button":"div");el.className="card "+(["diamonds","hearts"].includes(card.suit)?"red":"")+(selected.has(card.card_id)?" selected":"");var a=document.createElement("strong"),b=document.createElement("span"),c=document.createElement("em");a.textContent=rank(card);b.textContent=suit(card);c.textContent="#"+(Number(card.copy)+1);el.append(a,b,c);if(active)el.onclick=function(){selected.has(card.card_id)?selected.delete(card.card_id):selected.add(card.card_id);renderHand();renderControls()};return el}
  function render(){
    var group=snapshot.group||{},players=view.players||{},you=view.you||{};document.getElementById("phase").textContent=String(view.phase||"waiting").toUpperCase()+" · HAND "+(view.hand_number||"—");document.getElementById("frame").textContent="E"+(group.leader_epoch??"—")+" · F"+(group.seq??"—");var notice=document.getElementById("notice");notice.textContent=view.recovery_notice||"";notice.className="notice"+(view.recovery_notice?" show":"");
    document.getElementById("team0").textContent="LEVEL "+rank({rank:(view.levels||{}).team0});document.getElementById("team1").textContent="LEVEL "+rank({rank:(view.levels||{}).team1});document.getElementById("points0").textContent=((view.captured_points||{}).team0??0)+" PTS";document.getElementById("points1").textContent=((view.captured_points||{}).team1??0)+" PTS";
    var box=document.getElementById("players");box.replaceChildren();Object.keys(players).sort(function(a,b){return players[a].seat-players[b].seat}).forEach(function(key){var p=players[key],row=document.createElement("article");row.className="player"+(key===view.current_player?" current":"")+(key===you.public_key?" you":"");row.innerHTML='<span class="badge">'+(key===view.declarer?"DECLARER":"")+'</span><small>SEAT '+p.seat+' · '+String(p.team).toUpperCase()+'</small><b>'+shortKey(key)+(key===you.public_key?" · YOU":"")+'</b><strong>'+((view.hand_counts||{})[key]??0)+' CARDS</strong>';box.append(row)});
    var decl=document.getElementById("declarations");decl.replaceChildren();Object.keys(players).sort(function(a,b){return players[a].seat-players[b].seat}).forEach(function(key){var d=(view.declarations||{})[key],row=document.createElement("div");row.className="declaration";row.innerHTML="<span>"+shortKey(key)+"</span><b>"+(d?(d.kind==="pass_declare"?"PASS":("POWER "+d.strength)):"—")+"</b>";decl.append(row)});
    var trick=document.getElementById("trick");trick.replaceChildren();(view.current_trick||[]).forEach(function(play){(play.cards||[]).forEach(function(card){trick.append(cardNode(card,false))})});document.getElementById("trick-label").textContent=(view.current_trick||[]).length?String(view.current_trick[0].shape.kind).replaceAll("_"," ").toUpperCase()+" · "+(view.current_trick[0].shape.count||0)+" CARDS":"Awaiting the lead";
    document.getElementById("kitty").textContent=view.kitty_count??8;document.getElementById("trump").textContent="LEVEL "+rank({rank:view.level_rank})+" · "+(view.trump_suit?String(view.trump_suit).toUpperCase():"NO-TRUMP");
    document.getElementById("turn").textContent=view.phase==="declaration"?"OPEN DECLARATION WINDOW":view.current_player===you.public_key?"YOUR TURN":"TURN · "+shortKey(view.current_player);renderHand();renderControls()
  }
  function renderHand(){var hand=(view.my_hand||[]).slice().sort(function(a,b){return String(a.suit).localeCompare(String(b.suit))||Number(a.rank)-Number(b.rank)||Number(a.copy)-Number(b.copy)}),box=document.getElementById("hand");box.replaceChildren();hand.forEach(function(card){box.append(cardNode(card,true))});document.getElementById("hand-count").textContent=hand.length+" cards · "+selected.size+" selected"}
  function button(label,body,className){var el=document.createElement("button");el.textContent=label;if(className)el.className=className;el.onclick=function(){action(body)};return el}
  function renderControls(){var box=document.getElementById("controls");box.replaceChildren();var you=view.you||{},mine=view.current_player===you.public_key&&!snapshot.completed,ids=Array.from(selected),declared=Object.prototype.hasOwnProperty.call(view.declarations||{},you.public_key);if(view.phase==="declaration"){var declare=button("DECLARE TRUMP",{kind:"declare_trump",card_ids:ids},"primary");declare.disabled=!ready||declared||!(ids.length===1||ids.length===2);var pass=button("PASS DECLARATION",{kind:"pass_declare"},"pass");pass.disabled=!ready||declared;box.append(declare,pass)}else if(view.phase==="bury"){var bury=button("BURY 8 CARDS",{kind:"bury",card_ids:ids},"primary");bury.disabled=!mine||ids.length!==8||!ready;box.append(bury)}else if(view.phase==="playing"){var play=button("PLAY "+ids.length+" CARD"+(ids.length===1?"":"S"),{kind:"play",card_ids:ids},"primary");play.disabled=!mine||!ids.length||!ready;box.append(play)}else if(snapshot.completed){var done=document.createElement("strong");done.textContent="MATCH COMPLETE · "+String(snapshot.outcome||"").toUpperCase();box.append(done)}var clear=button("CLEAR",{});clear.onclick=function(){selected.clear();renderHand();renderControls()};clear.disabled=!selected.size;box.append(clear)}
  function errorText(response){return(response.data&&(response.data.error||response.data.reason))||response.error||("HTTP "+response.status)}
  function fail(error){var el=document.getElementById("status");el.textContent=error.message||String(error);el.className="status error"}
  async function action(body){try{var response=await request("action",body);if(!response.ok)throw new Error(errorText(response));var el=document.getElementById("status");el.textContent="Cards submitted to the authoritative table.";el.className="status"}catch(error){fail(error)}}
  post({type:"hello",capabilities:["snapshot","action"]});
})();
</script>
</body>
</html>
