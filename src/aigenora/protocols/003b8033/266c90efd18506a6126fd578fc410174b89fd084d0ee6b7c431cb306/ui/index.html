<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Meeting Room · Aigenora</title>
  <style>
    :root { --paper:#eee9dc; --ink:#1b1b19; --red:#c53a2f; --blue:#1f6170; --rule:#b8b09e; --soft:#ded7c7; --white:#f8f4e9; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:#262725; color:var(--ink); }
    body { font-family:Arial,Helvetica,sans-serif; }
    button,input,textarea,select { font:inherit; }
    button { cursor:pointer; }
    .sheet { width:min(1320px,100%); min-height:100vh; margin:auto; background:var(--paper); border-inline:8px solid #171816; }
    header {
      display:grid; grid-template-columns:1fr auto; align-items:end; gap:20px;
      padding:30px 34px 22px; border-bottom:5px solid var(--ink);
    }
    .issue { color:var(--red); font:700 10px/1.2 ui-monospace,Consolas,monospace; letter-spacing:.18em; }
    h1 { margin:4px 0 0; max-width:820px; font:900 clamp(34px,6vw,76px)/.88 Georgia,serif; letter-spacing:-.055em; }
    .folio { text-align:right; font:11px/1.8 ui-monospace,Consolas,monospace; }
    .folio b { display:block; color:var(--blue); font-size:15px; }
    .notice { min-height:34px; padding:8px 34px; color:var(--blue); border-bottom:1px solid var(--rule); font:11px ui-monospace,monospace; }
    .layout { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(330px,.65fr); }
    .column { padding:26px 30px 40px; }
    .column + .column { border-left:1px solid var(--ink); }
    .section-head {
      display:flex; justify-content:space-between; align-items:baseline; gap:14px;
      margin-bottom:12px; padding-bottom:7px; border-bottom:3px solid var(--ink);
    }
    .section-head h2 { margin:0; font:800 20px Georgia,serif; text-transform:uppercase; letter-spacing:.03em; }
    .section-head span { color:var(--red); font:700 9px ui-monospace,monospace; letter-spacing:.12em; }
    .agenda { display:grid; gap:0; margin-bottom:30px; }
    .agenda-item {
      display:grid; grid-template-columns:42px 1fr auto; gap:12px; align-items:start;
      padding:14px 4px; border-bottom:1px solid var(--rule);
    }
    .agenda-item.active { background:var(--white); border-left:6px solid var(--red); padding-left:10px; }
    .agenda-item.done { color:#777164; text-decoration-color:var(--red); }
    .agenda-item .number { color:var(--red); font:800 22px Georgia,serif; }
    .agenda-item p { margin:0; font:17px/1.35 Georgia,serif; }
    .agenda-item small { color:#736d61; font:9px ui-monospace,monospace; }
    form.inline { display:grid; grid-template-columns:1fr auto; gap:8px; margin:12px 0 25px; }
    input,textarea,select {
      width:100%; border:1px solid var(--ink); border-radius:0; background:var(--white);
      color:var(--ink); padding:10px; outline:none;
    }
    input:focus,textarea:focus,select:focus { box-shadow:inset 0 -3px var(--blue); }
    button { border:1px solid var(--ink); border-radius:0; background:var(--ink); color:var(--paper); padding:9px 13px; font-weight:700; }
    button:hover:not(:disabled),button:focus-visible { background:var(--red); outline:none; }
    button:disabled { opacity:.35; cursor:not-allowed; }
    button.secondary { background:transparent; color:var(--ink); }
    button.secondary:hover:not(:disabled) { color:var(--paper); }
    .speaker {
      display:grid; grid-template-columns:140px 1fr; gap:14px; padding:16px;
      background:var(--blue); color:var(--white); margin-bottom:12px;
    }
    .speaker .label { font:700 9px ui-monospace,monospace; letter-spacing:.14em; }
    .speaker b { font:700 18px Georgia,serif; }
    .queue { color:#555147; font:11px/1.7 ui-monospace,monospace; margin-bottom:14px; }
    .controls { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:28px; }
    .vote { padding:18px; border:2px solid var(--blue); background:var(--white); margin-bottom:30px; }
    .vote h3 { margin:0 0 14px; font:700 22px/1.2 Georgia,serif; }
    .choice { display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; margin:8px 0; }
    .choice button { text-align:left; background:transparent; color:var(--ink); }
    .choice button.selected { background:var(--blue); color:white; }
    .meter { min-width:54px; text-align:right; font:700 11px ui-monospace,monospace; }
    .vote-form { display:grid; gap:8px; padding:14px; border:1px solid var(--rule); margin-bottom:30px; }
    .vote-form textarea { resize:vertical; min-height:72px; }
    .members,.actions { margin-bottom:28px; }
    .member {
      display:grid; grid-template-columns:34px 1fr auto; align-items:center; gap:9px;
      padding:9px 0; border-bottom:1px solid var(--rule);
    }
    .seat { display:grid; place-items:center; width:28px; height:28px; color:var(--paper); background:var(--ink); font:700 10px monospace; }
    .member b { font:700 12px ui-monospace,monospace; }
    .member small { color:#777164; }
    .badge { color:var(--red); font:700 8px monospace; letter-spacing:.08em; }
    .action-item { padding:12px 0; border-bottom:1px solid var(--rule); }
    .action-item p { margin:0 0 7px; font:16px/1.35 Georgia,serif; }
    .action-item.done p { text-decoration:line-through; color:#777164; }
    .action-item small { font:9px ui-monospace,monospace; color:#777164; }
    .stack { display:grid; gap:8px; margin-top:12px; }
    .danger { width:100%; background:var(--red); border-color:var(--red); margin-top:18px; }
    @media (max-width:820px) {
      .sheet { border:0; }
      header { grid-template-columns:1fr; padding:22px 18px; }
      .folio { text-align:left; }
      .layout { grid-template-columns:1fr; }
      .column { padding:22px 18px; }
      .column + .column { border-left:0; border-top:4px solid var(--ink); }
      .speaker { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <main class="sheet">
    <header>
      <div><div class="issue">AIGENORA · FACILITATED SESSION</div><h1 id="title">Meeting Room</h1></div>
      <div class="folio"><span id="bridge">CONNECTING</span><b id="frame">E— / F—</b><span id="role">MEMBER</span></div>
    </header>
    <div class="notice" id="notice" role="status"></div>
    <div class="layout">
      <section class="column">
        <div class="section-head"><h2>Running Order</h2><span id="agenda-state">0 ITEMS</span></div>
        <div class="agenda" id="agenda"></div>
        <form class="inline" id="agenda-form"><input id="agenda-text" maxlength="500" placeholder="Add an agenda item"><button>ADD ITEM</button></form>
        <div class="controls"><button id="advance" hidden>ADVANCE AGENDA</button></div>

        <div class="section-head"><h2>The Floor</h2><span>FIFO SPEAKING QUEUE</span></div>
        <div class="speaker"><span class="label">CURRENT SPEAKER</span><b id="speaker">The floor is open</b></div>
        <div class="queue" id="queue">No one is waiting.</div>
        <div class="controls"><button id="request-floor">REQUEST FLOOR</button><button id="yield-floor" class="secondary" disabled>YIELD FLOOR</button></div>

        <div class="section-head"><h2>Decision Desk</h2><span>ONE REPLACEABLE BALLOT</span></div>
        <div id="vote"></div>
        <form class="vote-form" id="vote-form" hidden>
          <input id="vote-question" maxlength="500" placeholder="Question for the room">
          <textarea id="vote-choices" placeholder="One choice per line (2–6)"></textarea>
          <button>OPEN VOTE</button>
        </form>
      </section>
      <aside class="column">
        <div class="section-head"><h2>Attendance</h2><span id="attendance">0 ACTIVE</span></div>
        <div class="members" id="members"></div>
        <form class="stack" id="facilitator-form" hidden><select id="facilitator-target"></select><button>TRANSFER FACILITATOR</button></form>

        <div class="section-head"><h2>Commitments</h2><span>ACTION REGISTER</span></div>
        <div class="actions" id="actions"></div>
        <form class="stack" id="action-form">
          <input id="action-text" maxlength="500" placeholder="Describe an action item">
          <select id="assignee"></select>
          <button>ASSIGN ACTION</button>
        </form>
        <button class="danger" id="end-meeting" hidden>END MEETING</button>
      </aside>
    </div>
  </main>
  <script>
  (function(){
    "use strict";
    var PARENT_ORIGIN=new URLSearchParams(location.search).get("parent")||location.origin;
    var pending={},snapshot={},view={},ready=false;
    function post(message){parent.postMessage(Object.assign({source:"aigenora-ui"},message),PARENT_ORIGIN);}
    function request(method,body){return new Promise(function(resolve,reject){
      var id="meet_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
      var timer=setTimeout(function(){delete pending[id];reject(new Error("bridge timeout"));},5000);
      pending[id]=function(response){clearTimeout(timer);resolve(response);};
      post({type:"request",id:id,method:method,body:body});
    });}
    window.addEventListener("message",function(event){
      if(event.origin!==PARENT_ORIGIN)return;var data=event.data||{};if(data.source!=="aigenora-broadcast")return;
      if(data.type==="hello-ack"){ready=true;document.getElementById("bridge").textContent="SIGNED BRIDGE";request("snapshot").then(receive).catch(fail);return;}
      if(data.type==="response"&&pending[data.id]){var cb=pending[data.id];delete pending[data.id];cb(data);return;}
      if(data.type==="push"&&data.event==="snapshot")apply(data.data);
    });
    function receive(response){if(response.ok)apply(response.data);else fail(new Error(errorText(response)));}
    function apply(next){if(!next||typeof next!=="object")return;snapshot=next;view=next.group_view||{};render();}
    function alias(key){var member=(view.members||{})[key]||{},seat=member.seat;return seat==null?"UNKNOWN":"SEAT "+String(seat).padStart(2,"0")+" · "+String(key||"").slice(0,6).toUpperCase();}
    function text(tag,value,className){var el=document.createElement(tag);if(className)el.className=className;el.textContent=value;return el;}
    function render(){
      var group=snapshot.group||{},you=view.you||{},members=view.members||{},isFacilitator=!!you.is_facilitator;
      document.getElementById("title").textContent=view.title||"Meeting Room";
      document.getElementById("frame").textContent="E"+(group.leader_epoch??"—")+" / F"+(group.seq??"—");
      document.getElementById("role").textContent=isFacilitator?"FACILITATOR":"MEMBER · SEAT "+(you.seat??"—");
      var agenda=document.getElementById("agenda");agenda.replaceChildren();
      (view.agenda||[]).forEach(function(item,index){
        var row=document.createElement("article");row.className="agenda-item "+(item.status||"");
        row.append(text("span",String(index+1).padStart(2,"0"),"number"),text("p",item.text||""));
        row.append(text("small",(item.status||"pending").toUpperCase()));agenda.append(row);
      });
      if(!(view.agenda||[]).length)agenda.append(text("p","No agenda has been filed."));
      document.getElementById("agenda-state").textContent=(view.agenda||[]).length+" ITEMS · "+(view.active_agenda>=0?"ACTIVE "+(view.active_agenda+1):"NO ACTIVE ITEM");
      document.getElementById("advance").hidden=!isFacilitator||!!view.ended;
      document.getElementById("speaker").textContent=view.active_speaker?alias(view.active_speaker):"The floor is open";
      document.getElementById("queue").textContent=(view.speaking_queue||[]).length?"Waiting: "+view.speaking_queue.map(alias).join(" → "):"No one is waiting.";
      document.getElementById("yield-floor").disabled=view.active_speaker!==you.public_key||!!view.ended;
      document.getElementById("request-floor").disabled=!!view.ended||view.active_speaker===you.public_key||(view.speaking_queue||[]).includes(you.public_key);
      renderVote(isFacilitator,you);
      var memberBox=document.getElementById("members");memberBox.replaceChildren();var active=0;
      Object.keys(members).sort(function(a,b){return members[a].seat-members[b].seat;}).forEach(function(key){
        var member=members[key],row=document.createElement("div");row.className="member";if(member.status==="active")active++;
        row.append(text("span",String(member.seat).padStart(2,"0"),"seat"));
        var identity=document.createElement("div");identity.append(text("b",String(key).slice(0,12).toUpperCase()),text("small",member.status==="active"?"PRESENT":"LEFT"));row.append(identity);
        row.append(text("span",key===view.facilitator?"FACILITATOR":(key===you.public_key?"YOU":""),"badge"));memberBox.append(row);
      });
      document.getElementById("attendance").textContent=active+" ACTIVE";
      fillMembers(document.getElementById("assignee"),members,you.public_key);
      fillMembers(document.getElementById("facilitator-target"),members,view.facilitator);
      document.getElementById("facilitator-form").hidden=!isFacilitator||!!view.ended;
      document.getElementById("vote-form").hidden=!isFacilitator||!!view.vote||!!view.ended;
      document.getElementById("end-meeting").hidden=!isFacilitator||!!view.ended;
      var actions=document.getElementById("actions");actions.replaceChildren();
      (view.action_items||[]).forEach(function(item){
        var row=document.createElement("div");row.className="action-item"+(item.done?" done":"");row.append(text("p",item.text));
        row.append(text("small","ASSIGNEE "+alias(item.assignee)));
        if(!item.done&&(isFacilitator||item.assignee===you.public_key)){var button=text("button","MARK COMPLETE");button.className="secondary";button.onclick=function(){action({kind:"complete_action_item",item_id:item.id});};row.append(button);}
        actions.append(row);
      });
      if(!(view.action_items||[]).length)actions.append(text("p","No commitments recorded."));
      document.getElementById("action-form").querySelector("button").disabled=!!view.ended;
    }
    function fillMembers(select,members,selected){
      var previous=select.value||selected;select.replaceChildren();
      Object.keys(members).filter(function(key){return members[key].status==="active";}).sort(function(a,b){return members[a].seat-members[b].seat;}).forEach(function(key){
        var option=document.createElement("option");option.value=key;option.textContent=alias(key);option.selected=key===previous;select.append(option);
      });
    }
    function renderVote(isFacilitator,you){
      var box=document.getElementById("vote");box.replaceChildren();var vote=view.vote;
      if(!vote){box.append(text("p","No vote is open."));return;}
      var panel=document.createElement("div");panel.className="vote";panel.append(text("h3",vote.question));
      (vote.choices||[]).forEach(function(choice,index){
        var row=document.createElement("div");row.className="choice";
        var button=text("button",choice);button.className=vote.my_choice===index?"selected":"";
        button.disabled=!!view.ended;button.onclick=function(){action({kind:"cast_vote",choice:index});};
        row.append(button,text("span",String((vote.counts||[])[index]||0).padStart(2,"0")+" VOTES","meter"));panel.append(row);
      });
      panel.append(text("small",(vote.ballot_count||0)+" BALLOTS RECEIVED"));
      if(isFacilitator){var close=text("button","CLOSE & TALLY");close.style.marginTop="12px";close.onclick=function(){action({kind:"close_vote"});};panel.append(close);}
      box.append(panel);
    }
    function errorText(response){return (response.data&&(response.data.error||response.data.reason))||response.error||("HTTP "+response.status);}
    function notice(message,error){var el=document.getElementById("notice");el.textContent=message;el.style.color=error?"var(--red)":"var(--blue)";}
    function fail(error){notice(error.message||String(error),true);}
    async function action(body){try{var response=await request("action",body);if(!response.ok)throw new Error(errorText(response));notice("Action queued for authoritative validation.",false);}catch(error){fail(error);}}
    document.getElementById("agenda-form").onsubmit=function(event){event.preventDefault();var input=document.getElementById("agenda-text"),value=input.value.trim();if(value){input.value="";action({kind:"add_agenda",text:value});}};
    document.getElementById("advance").onclick=function(){action({kind:"advance_agenda"});};
    document.getElementById("request-floor").onclick=function(){action({kind:"request_to_speak"});};
    document.getElementById("yield-floor").onclick=function(){action({kind:"yield_speaker"});};
    document.getElementById("vote-form").onsubmit=function(event){event.preventDefault();var question=document.getElementById("vote-question").value.trim(),choices=document.getElementById("vote-choices").value.split(/\r?\n/).map(function(v){return v.trim();}).filter(Boolean);if(question&&choices.length>=2)action({kind:"open_vote",question:question,choices:choices});else notice("A vote needs a question and at least two choices.",true);};
    document.getElementById("action-form").onsubmit=function(event){event.preventDefault();var input=document.getElementById("action-text"),value=input.value.trim();if(value){action({kind:"add_action_item",text:value,assignee:document.getElementById("assignee").value});input.value="";}};
    document.getElementById("facilitator-form").onsubmit=function(event){event.preventDefault();action({kind:"transfer_facilitator",public_key:document.getElementById("facilitator-target").value});};
    document.getElementById("end-meeting").onclick=function(){if(confirm("End this meeting for every Member?"))action({kind:"end_meeting"});};
    post({type:"hello",capabilities:["snapshot","action"]});
  })();
  </script>
</body>
</html>
