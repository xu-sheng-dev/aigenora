<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Classical Mahjong Core · Aigenora</title>
  <style>
    :root{--jade:#164c42;--jade2:#0b302b;--ink:#15211e;--bone:#f3ecd8;--tile:#fffdf3;--cinnabar:#b84332;--gold:#d5ae5a;--mist:#a7c3b9;--line:#47766b}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#061d1a;color:var(--bone)}body{font-family:Cambria,Georgia,serif;background-image:radial-gradient(circle at 20% 0,#17483e 0,transparent 34%),linear-gradient(30deg,rgba(255,255,255,.018) 12%,transparent 12.5%,transparent 87%,rgba(255,255,255,.018) 87.5%)}
    button{font:inherit}.house{width:min(1500px,100%);min-height:100vh;margin:auto;padding:17px clamp(10px,2.8vw,40px) 30px}
    header{display:flex;justify-content:space-between;align-items:end;border-bottom:2px solid var(--gold);padding:8px 0 15px}.mark{color:var(--gold);font:9px ui-monospace,Consolas,monospace;letter-spacing:.25em}h1{margin:6px 0 0;font-size:clamp(29px,4.5vw,54px);font-weight:500;letter-spacing:-.035em}.telemetry{text-align:right;font:10px/1.6 ui-monospace,Consolas,monospace;color:var(--mist)}.telemetry b{display:block;color:var(--bone);font-size:14px}
    .notice{display:none;margin-top:11px;padding:8px 12px;border:1px solid var(--gold);color:var(--gold);font:10px ui-monospace,Consolas,monospace}.notice.show{display:block}
    .table{margin-top:15px;padding:14px;border:8px solid #6f4b2c;outline:2px solid #bb8c4e;background:var(--jade2);box-shadow:inset 0 0 45px #031512}
    .players{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.player{padding:10px;border:1px solid var(--line);background:#103b34;min-width:0}.player.current{border-color:var(--gold);box-shadow:inset 0 -4px var(--gold)}.player.you{background:#1d594e}.player .wind{float:right;font-size:25px;color:var(--gold)}.player small{display:block;color:var(--mist);font:9px ui-monospace,Consolas,monospace}.player b{display:block;margin:6px 0;overflow:hidden;text-overflow:ellipsis;font:13px ui-monospace,Consolas,monospace}.player strong{font-size:20px}
    .center{display:grid;grid-template-columns:minmax(210px,.8fr) minmax(340px,1.5fr) minmax(210px,.8fr);gap:13px;min-height:340px;padding:18px 0}.box{border:1px solid var(--line);background:var(--jade);padding:11px;min-width:0}.box h2{margin:0 0 10px;color:var(--gold);font:10px ui-monospace,Consolas,monospace;letter-spacing:.16em}.river{display:flex;flex-wrap:wrap;gap:4px;align-content:start;min-height:130px}.river-group{margin-bottom:11px}.river-group small{display:block;margin-bottom:5px;color:var(--mist);font:8px ui-monospace,Consolas,monospace}
    .tile{position:relative;width:46px;height:63px;padding:5px 3px;border:1px solid #c6bda8;border-radius:4px 4px 6px 6px;background:linear-gradient(90deg,#fffdf4,#eee6d2);color:var(--ink);box-shadow:2px 3px 0 #0a2823;text-align:center;user-select:none}.tile:after{content:"";position:absolute;inset:auto 2px -4px;height:5px;border-radius:0 0 4px 4px;background:#b8d3c5}.tile.red{color:var(--cinnabar)}.tile strong{display:block;font:700 17px/1.1 Georgia,serif}.tile span{font-size:11px}button.tile{cursor:pointer;transition:.12s transform}button.tile:hover,button.tile:focus-visible{transform:translateY(-6px);outline:2px solid var(--gold)}button.tile.selected{transform:translateY(-11px);box-shadow:0 0 0 3px var(--gold)}
    .last{display:grid;place-items:center;min-height:130px;text-align:center}.last .tile{width:72px;height:96px;padding-top:13px}.last .tile strong{font-size:28px}.last p{margin:12px 0 0;color:var(--mist);font:9px/1.6 ui-monospace,Consolas,monospace}.wall{font-size:56px;color:var(--gold);line-height:1}.wall-label{color:var(--mist);font:9px ui-monospace,Consolas,monospace}
    .meld{margin-bottom:9px;padding-bottom:9px;border-bottom:1px dotted var(--line)}.meld small{display:block;margin-bottom:5px;color:var(--mist);font:8px ui-monospace,Consolas,monospace}.meld-row{display:flex;gap:3px}.meld-row .tile{width:38px;height:53px}
    .hand-zone{border-top:1px solid var(--line);padding:14px 0 3px}.hand-head{display:flex;justify-content:space-between;align-items:end}.hand-head small{color:var(--mist);font:9px ui-monospace,Consolas,monospace;letter-spacing:.16em}.hand-head b{font-size:20px}.hand-scroll{overflow-x:auto;padding:17px 5px 4px}.hand{display:flex;justify-content:center;gap:4px;min-width:max-content}
    .controls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}.controls button{min-width:94px;padding:9px 12px;border:1px solid var(--gold);background:#0b302a;color:var(--bone);cursor:pointer}.controls button.primary{background:var(--gold);color:var(--ink);font-weight:800}.controls button.win{border-color:var(--cinnabar);background:var(--cinnabar);font-weight:800}.controls button:disabled{opacity:.3;cursor:not-allowed}.status{min-height:24px;text-align:center;padding-top:10px;color:var(--mist);font:9px ui-monospace,Consolas,monospace}.status.error{color:#ff8c7f}
    @media(max-width:900px){.players{grid-template-columns:1fr 1fr}.center{grid-template-columns:1fr 1fr}.center .focus{grid-column:1/-1;grid-row:1}.hand{justify-content:flex-start}}
    @media(max-width:600px){header{display:block}.telemetry{text-align:left;margin-top:8px}.table{border-width:5px;padding:8px}.center{display:block}.box{margin-bottom:9px}.tile{width:41px;height:58px}.players{gap:5px}.player{padding:7px}}
  </style>
</head>
<body>
<main class="house">
  <header><div><div class="mark">AIGENORA · JADE HOUSE</div><h1>Classical Mahjong Core</h1></div><div class="telemetry"><span id="link">WALL LINK OFFLINE</span><b id="phase">WAITING</b><span id="frame">E— · F—</span></div></header>
  <div class="notice" id="notice"></div>
  <section class="table">
    <div class="players" id="players"></div>
    <div class="center">
      <section class="box"><h2>PUBLIC RIVERS</h2><div id="rivers"></div></section>
      <section class="box focus"><h2>CLAIM WINDOW &amp; LAST DISCARD</h2><div class="last" id="last"></div></section>
      <section class="box"><h2>PUBLIC MELDS</h2><div id="melds"></div></section>
    </div>
    <div class="hand-zone"><div class="hand-head"><div><small>YOUR CONCEALED HAND</small><b id="hand-count">0 tiles</b></div><div><small id="turn">WAITING</small></div></div><div class="hand-scroll"><div class="hand" id="hand"></div></div><div class="controls" id="controls"></div><div class="status" id="status" role="status"></div></div>
  </section>
</main>
<script>
(function(){
  "use strict";
  var ORIGIN=new URLSearchParams(location.search).get("parent")||location.origin,pending={},snapshot={},view={},ready=false,selected=new Set(),lastHand="";
  function post(message){parent.postMessage(Object.assign({source:"aigenora-ui"},message),ORIGIN)}
  function request(method,body){return new Promise(function(resolve,reject){var id="mahjong_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7),timer=setTimeout(function(){delete pending[id];reject(new Error("wall bridge timeout"))},5000);pending[id]=function(value){clearTimeout(timer);resolve(value)};post({type:"request",id:id,method:method,body:body})})}
  window.addEventListener("message",function(event){if(event.origin!==ORIGIN)return;var data=event.data||{};if(data.source!=="aigenora-broadcast")return;if(data.type==="hello-ack"){ready=true;document.getElementById("link").textContent="SIGNED WALL LINK";request("snapshot").then(receive).catch(fail);return}if(data.type==="response"&&pending[data.id]){var cb=pending[data.id];delete pending[data.id];cb(data);return}if(data.type==="push"&&data.event==="snapshot")apply(data.data)});
  function receive(response){if(response.ok)apply(response.data);else fail(new Error(errorText(response)))}
  function apply(next){if(!next||typeof next!=="object")return;snapshot=next;view=next.group_view||{};var key=(view.my_hand||[]).map(function(tile){return tile.card_id}).join(",");if(key!==lastHand){selected.clear();lastHand=key}render()}
  function shortKey(key){return String(key||"").slice(0,7).toUpperCase()}
  function tileParts(tile){var code=String(tile.code||"?");if(/^[1-9][mps]$/.test(code))return[code.charAt(0),({m:"MAN",p:"PIN",s:"SOU"})[code.charAt(1)]];return[({east:"E",south:"S",west:"W",north:"N",red:"RED",green:"GRN",white:"WHT"})[code]||code,""]}
  function tileNode(tile,active){var part=tileParts(tile),el=document.createElement(active?"button":"div");el.className="tile "+(["red"].includes(tile.code)?"red":"")+(selected.has(tile.card_id)?" selected":"");var a=document.createElement("strong"),b=document.createElement("span");a.textContent=part[0];b.textContent=part[1];el.append(a,b);if(active)el.onclick=function(){selected.has(tile.card_id)?selected.delete(tile.card_id):selected.add(tile.card_id);renderHand();renderControls()};return el}
  function render(){
    var group=snapshot.group||{},players=view.players||{},you=view.you||{};document.getElementById("phase").textContent=String(view.phase||"waiting").toUpperCase()+" · HAND "+(view.hand_number||"—");document.getElementById("frame").textContent="E"+(group.leader_epoch??"—")+" · F"+(group.seq??"—");var notice=document.getElementById("notice");notice.textContent=view.recovery_notice||"";notice.className="notice"+(view.recovery_notice?" show":"");
    var box=document.getElementById("players");box.replaceChildren();Object.keys(players).sort(function(a,b){return players[a].seat-players[b].seat}).forEach(function(key){var p=players[key],row=document.createElement("article");row.className="player"+(key===view.current_player?" current":"")+(key===you.public_key?" you":"");row.innerHTML='<span class="wind">'+String(p.wind||"?").charAt(0).toUpperCase()+'</span><small>SEAT '+p.seat+(key===view.dealer?" · DEALER":"")+'</small><b>'+shortKey(key)+(key===you.public_key?" · YOU":"")+'</b><strong>'+((view.scores||{})[key]??0)+'</strong><small>'+((view.hand_counts||{})[key]??0)+' CONCEALED</small>';box.append(row)});
    var rivers=document.getElementById("rivers");rivers.replaceChildren();Object.keys(view.rivers||{}).forEach(function(key){var group=document.createElement("div");group.className="river-group";var label=document.createElement("small");label.textContent=shortKey(key);var row=document.createElement("div");row.className="river";(view.rivers[key]||[]).forEach(function(tile){row.append(tileNode(tile,false))});group.append(label,row);rivers.append(group)});
    var last=document.getElementById("last");last.replaceChildren();if(view.last_discard){last.append(tileNode(view.last_discard.card,false));var p=document.createElement("p");p.textContent="FROM "+shortKey(view.last_discard.public_key)+" · "+(view.claim_response_count||0)+"/"+(view.claim_required_count||0)+" RESPONSES";last.append(p)}else{var wall=document.createElement("div");wall.className="wall";wall.textContent=view.wall_count??0;var label=document.createElement("div");label.className="wall-label";label.textContent="TILES REMAIN IN THE HIDDEN WALL";last.append(wall,label)}
    var melds=document.getElementById("melds");melds.replaceChildren();Object.keys(view.melds||{}).forEach(function(key){(view.melds[key]||[]).forEach(function(meld){var group=document.createElement("div");group.className="meld";var label=document.createElement("small");label.textContent=shortKey(key)+" · "+String(meld.kind).toUpperCase();var row=document.createElement("div");row.className="meld-row";(meld.cards||[]).forEach(function(tile){row.append(tileNode(tile,false))});group.append(label,row);melds.append(group)})});
    document.getElementById("turn").textContent=view.phase==="claim"?(you.may_claim?"YOUR CLAIM RESPONSE":"CLAIMS PENDING"):view.current_player===you.public_key?"YOUR DISCARD":"TURN · "+shortKey(view.current_player);renderHand();renderControls()
  }
  function renderHand(){var hand=(view.my_hand||[]).slice().sort(function(a,b){return String(a.code).localeCompare(String(b.code),undefined,{numeric:true})}),box=document.getElementById("hand");box.replaceChildren();hand.forEach(function(tile){box.append(tileNode(tile,true))});document.getElementById("hand-count").textContent=hand.length+" tiles · "+selected.size+" selected"}
  function button(label,body,className){var el=document.createElement("button");el.textContent=label;if(className)el.className=className;el.onclick=function(){action(body)};return el}
  function renderControls(){var box=document.getElementById("controls");box.replaceChildren();var you=view.you||{},mine=view.current_player===you.public_key&&!snapshot.completed,ids=Array.from(selected);if(view.phase==="discard"){var discard=button("DISCARD",{kind:"discard",card_id:ids[0]},"primary");discard.disabled=!mine||ids.length!==1||!ready;box.append(discard);var kong=button("CONCEALED KONG",{kind:"concealed_kong",card_ids:ids});kong.disabled=!mine||ids.length!==4||!ready;box.append(kong);var win=button("DECLARE WIN",{kind:"win"},"win");win.disabled=!mine||!ready;box.append(win)}else if(view.phase==="claim"&&you.may_claim&&!view.my_claim){var pass=button("PASS",{kind:"pass_claim"});pass.disabled=!ready;box.append(pass);var win=button("WIN",{kind:"win"},"win");win.disabled=!ready;box.append(win);["chow","pung","kong"].forEach(function(kind){var needed=kind==="kong"?3:2,node=button(kind.toUpperCase(),{kind:kind,card_ids:ids},kind==="pung"?"primary":"");node.disabled=!ready||ids.length!==needed;box.append(node)})}else if(snapshot.completed){var done=document.createElement("strong");done.textContent="MATCH COMPLETE · "+shortKey(snapshot.outcome);box.append(done)}else{var waiting=document.createElement("span");waiting.textContent=view.phase==="claim"?"WAITING FOR CLAIM RESPONSES":"WAITING FOR TURN";box.append(waiting)}}
  function errorText(response){return(response.data&&(response.data.error||response.data.reason))||response.error||("HTTP "+response.status)}
  function fail(error){var el=document.getElementById("status");el.textContent=error.message||String(error);el.className="status error"}
  async function action(body){try{var response=await request("action",body);if(!response.ok)throw new Error(errorText(response));var el=document.getElementById("status");el.textContent="Tile action submitted to the authoritative wall.";el.className="status"}catch(error){fail(error)}}
  post({type:"hello",capabilities:["snapshot","action"]});
})();
</script>
</body>
</html>
