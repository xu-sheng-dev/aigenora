<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Human Chat · Business Panel</title>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body { font-family: -apple-system, "Segoe UI", sans-serif;
         display: grid; grid-template-rows: auto 1fr auto; min-height: 100%;
         background: linear-gradient(180deg, transparent, #8881 100%); }
  header { padding: 14px 20px; border-bottom: 1px solid #8884; display: flex;
           align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 16px; letter-spacing: .02em; }
  header .meta { color: #888; font-size: 12px; }
  header .tag { display: inline-block; padding: 2px 8px; border-radius: 3px;
                background: #58f4; font-size: 11px; margin-left: 6px; }
  header .tag.ended { background: #f844; }
  main { padding: 20px; display: grid; gap: 18px; grid-template-columns: 1fr; align-content: start; }
  .card { border: 1px solid #8884; border-radius: 8px; padding: 16px 18px;
          background: #8881; backdrop-filter: blur(6px); }
  .card h2 { margin: 0 0 12px; font-size: 11px; color: #888;
             text-transform: uppercase; letter-spacing: .08em; }
  .messages { display: flex; flex-direction: column; gap: 8px;
              max-height: 420px; overflow-y: auto; padding: 4px;
              min-height: 120px; }
  .messages .empty { color: #888; font-size: 13px; text-align: center; padding: 30px 0; }
  .bubble { display: flex; max-width: 78%; padding: 8px 12px; border-radius: 12px;
            font-size: 14px; line-height: 1.4; word-break: break-word; white-space: pre-wrap; }
  .bubble.self { align-self: flex-end; background: #58f4; border-bottom-right-radius: 4px; }
  .bubble.peer { align-self: flex-start; background: #8883; border-bottom-left-radius: 4px; }
  .bubble .seq { font-size: 10px; color: #888; margin-right: 6px; flex: 0 0 auto; }
  .compose { display: flex; gap: 8px; margin-top: 10px; align-items: flex-end; }
  .compose textarea { flex: 1; min-height: 40px; max-height: 140px; resize: vertical;
    padding: 8px; font-size: 13px; border: 1px solid #8884; border-radius: 6px;
    background: transparent; color: inherit; font-family: inherit; }
  .compose button { padding: 10px 20px; border: 1px solid #8884; background: #58f3; color: inherit;
                    border-radius: 6px; cursor: pointer; font-size: 13px; }
  .compose button:hover:not(:disabled) { background: #58f5; }
  .compose button:disabled { opacity: .4; cursor: not-allowed; }
  .hint { font-size: 11px; color: #888; margin-top: 6px; }
  footer { padding: 10px 20px; border-top: 1px solid #8884; font-size: 11px; color: #888; }
  footer code { font-family: "Consolas", "Menlo", monospace; }
</style>
</head>
<body>
<header>
  <div><h1>Human Chat <span class="tag" id="phase-tag">--</span></h1></div>
  <div class="meta" id="meta">connecting...</div>
</header>
<main>
  <section class="card">
    <h2>Messages</h2>
    <div class="messages" id="messages"><div class="empty">No messages yet</div></div>
    <div class="compose">
      <textarea id="compose-text" placeholder="Type a message... (Enter to send, Shift+Enter for newline)" rows="1"></textarea>
      <button id="compose-send">Send</button>
    </div>
    <div class="hint">Type <code>/quit</code> to end the chat. Messages are relayed verbatim — agents do not interpret content.</div>
  </section>
</main>
<footer>Human Chat · reads via <code>/api/snapshot</code> and <code>/sse/stream</code> · sends via <code>/api/chat/send</code></footer>

<script>
const $ = (s) => document.querySelector(s);
let snap = {};

function agentLabel() {
  try {
    let id = sessionStorage.getItem("aigenora.agent_id");
    if (!id) {
      id = "browser-" + Math.random().toString(36).slice(2, 10);
      sessionStorage.setItem("aigenora.agent_id", id);
    }
    return id;
  } catch (_) {
    return "browser-anon";
  }
}

function _esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function renderSnapshot(s) {
  snap = s || {};
  const phase = snap.phase || "--";
  const phaseTag = $("#phase-tag");
  if (phase === "ended") {
    phaseTag.textContent = "ended";
    phaseTag.className = "tag ended";
    $("#compose-send").disabled = true;
    $("#compose-text").disabled = true;
  } else {
    phaseTag.textContent = phase;
    phaseTag.className = "tag";
  }
  $("#meta").textContent = `Human Chat · ${phase}`;
  renderMessages(snap.messages || []);
}

function renderMessages(msgs) {
  const box = $("#messages");
  if (!msgs.length) {
    box.innerHTML = '<div class="empty">No messages yet</div>';
    return;
  }
  box.innerHTML = msgs.map(m => {
    const cls = m.from === "self" ? "self" : "peer";
    return `<div class="bubble ${cls}"><span class="seq">#${m.seq}</span><span>${_esc(m.text || "")}</span></div>`;
  }).join("");
  box.scrollTop = box.scrollHeight;
}

async function sendMessage() {
  const ta = $("#compose-text");
  const text = ta.value.trim();
  if (!text) return;
  const btn = $("#compose-send");
  btn.disabled = true;
  ta.disabled = true;
  try {
    const r = await fetch("/api/chat/send", {
      method: "POST",
      body: JSON.stringify({ text, agent_id: agentLabel() }),
    });
    if (r.ok) {
      ta.value = "";
    } else {
      const d = await r.json().catch(() => ({}));
      alert("Failed: " + (d.error || r.status));
    }
  } catch (e) {
    alert("Network error: " + e.message);
  } finally {
    if (snap.phase !== "ended") {
      btn.disabled = false;
      ta.disabled = false;
      ta.focus();
    }
  }
}

$("#compose-send").addEventListener("click", sendMessage);
$("#compose-text").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    sendMessage();
  }
});

const es = new EventSource("/sse/stream");
es.addEventListener("snapshot", e => renderSnapshot(JSON.parse(e.data)));
es.onerror = () => {};

(async () => {
  try {
    renderSnapshot(await fetch("/api/snapshot").then(r => r.json()));
  } catch (_) {}
})();
</script>
</body>
</html>
